<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learn-Ru-Dee</title>
    <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg, #C1A7E2 0%, #8BB8E8 100%);
    }
    .embed{
      width:max(85vw, min(1200px,98vw));
      height:calc(100vh - 32px);
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:12px;
      overflow:hidden;
      margin-left: 16px;
    }
  </style>
</head>
<body>
  <div id="flat-chat" class="embed"></div>
  <script type="text/javascript">
    (function(d,t){
      var v=d.createElement(t), s=d.getElementsByTagName(t)[0];
      v.onload=function(){
        var uid = localStorage.getItem("vf_user_id");
        if(!uid){
          uid = Math.random().toString(36).slice(2);
          localStorage.setItem("vf_user_id", uid);
        }
        window.voiceflow.chat.load({
          verify:{ projectID:"6a0549f0b088a2f0ccb122b3" },
          url:"https://general-runtime.voiceflow.com",
          versionID:"production",
          user:{ id: uid },
          assistant:{
            stylesheet: "https://cdn.jsdelivr.net/gh/learn-ru-dee/adaptive-learning@main/custom.css?v=7"
          },
          render:{ mode:"embedded", target: document.getElementById("flat-chat") },
          autostart:true
        });
      };
      v.src="https://cdn.voiceflow.com/widget-next/bundle.mjs";
      v.type="text/javascript"; s.parentNode.insertBefore(v,s);
    })(document,"script");
  </script>
  <script>
(function () {
  // 1) ปุ่มสีแดงเด่น
  const BTN_TEXT  = 'ถามเวก้า';
  const BTN_STYLE = { background:'#26A69A', borderColor:'#26A69A', color:'#fff', fontWeight:'700' };
  const ENTER_TEXT  = 'เข้าสู่ Module';
  const ENTER_STYLE = { background:'#1E88E5', borderColor:'#1E88E5', color:'#fff', fontWeight:'700' };

  // 2) กล่อง "วิธีเรียนรู้ในโมดูลนี้" พื้นเขียว
  const BOX_TEXT  = 'วิธีเรียนรู้ในโมดูลนี้';
  const BOX_STYLE = { background:'#E8F5E9' };   // เขียวอ่อน อ่านตัวหนังสือชัด
  const SUM_TEXT  = 'ช่วยสรุป 1 สิ่ง';
const SUM_STYLE = { background:'#26A69A', color:'#fff', fontWeight:'700' };
const GOAL_TEXT  = 'ก่อนเริ่มเรียน ขอถามสักนิดค่ะ';
const GOAL_STYLE = { background:'#26A69A', color:'#fff', fontWeight:'700' };
  function paint(root) {
    root.querySelectorAll('button').forEach(b => {
      if (b.textContent.includes(BTN_TEXT)) Object.assign(b.style, BTN_STYLE);
      if (b.textContent.includes(ENTER_TEXT)) Object.assign(b.style, ENTER_STYLE);
    });
    root.querySelectorAll('[class*="message"]').forEach(m => {
      if (m.textContent.includes(BOX_TEXT)) Object.assign(m.style, BOX_STYLE);
    });
    root.querySelectorAll('[class*="message"]').forEach(m => {
      if (m.textContent.includes(SUM_TEXT)) Object.assign(m.style, SUM_STYLE);
    });
    root.querySelectorAll('[class*="message"]').forEach(m => {
      if (m.textContent.includes(GOAL_TEXT)) Object.assign(m.style, GOAL_STYLE);
    });
  }
  function roots(node, out) { out = out || [];
    node.querySelectorAll('*').forEach(el => {
      if (el.shadowRoot) { out.push(el.shadowRoot); roots(el.shadowRoot, out); }
    });
    return out;
  }
  setInterval(() => { paint(document); roots(document.body).forEach(paint); }, 800);
})();
</script>
<script>
(function () {
  // 3) สีสถานะการเรียน: แดง = ยังไม่เริ่ม, ส้ม = กำลังเรียน, เขียว = เรียนจบแล้ว
  var RULES = [
    { text: 'ยังไม่เริ่ม', color: '#D32F2F' },
    { text: 'in_progress', color: '#EF8F00', label: 'กำลังเรียน' },
    { text: 'completed',   color: '#2E7D32', label: 'เรียนจบแล้ว' }
  ];
  var KEY = 'สถานะการเรียน';
  function paintStatus(root) {
    if (!root.textContent || root.textContent.indexOf(KEY) < 0) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var nodes = [];
    while (walker.nextNode()) {
      var n = walker.currentNode;
      if (n.nodeValue && n.nodeValue.indexOf(KEY) >= 0 && !(n.parentElement && n.parentElement.hasAttribute('data-vega-status'))) nodes.push(n);
    }
    nodes.forEach(function (n) {
      RULES.forEach(function (r) {
        var v = n.nodeValue, i = v.indexOf(r.text);
        if (i < 0) return;
        var span = document.createElement('span');
        span.setAttribute('data-vega-status', '1');
        span.style.color = r.color;
        span.style.fontWeight = '700';
        span.textContent = r.label || r.text;
        var after = document.createTextNode(v.slice(i + r.text.length));
        n.nodeValue = v.slice(0, i);
        n.parentNode.insertBefore(span, n.nextSibling);
        n.parentNode.insertBefore(after, span.nextSibling);
      });
    });
  }
  function attach() {
    var host = document.querySelector('#flat-chat') || document.querySelector('#voiceflow-chat');
    if (!host || !host.shadowRoot) return false;
    var root = host.shadowRoot, pending = false;
    paintStatus(root);
    new MutationObserver(function () {
      if (pending) return;
      pending = true;
      setTimeout(function () { pending = false; paintStatus(root); }, 300);
    }).observe(root, { childList: true, subtree: true });
    return true;
  }
  var tries = 0, timer = setInterval(function () { if (attach() || ++tries > 60) clearInterval(timer); }, 500);
})();
</script>
<script>
(function () {
  // 4) I-014: แปลงเครื่องหมาย " และ \ ที่ผู้เรียนพิมพ์หรือวาง เป็น ' และ / ก่อนส่ง
  //    (ถ้ามีเครื่องหมายนี้ ข้อมูลที่ส่งไป n8n จะเสีย ข้อความหาย และ workshop บันทึกคะแนนผิด)
  function attach() {
    var host = document.querySelector('#flat-chat');
    if (!host || !host.shadowRoot) return false;
    var setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;
    host.shadowRoot.addEventListener('input', function (e) {
      var t = e.target;
      if (!t || t.tagName !== 'TEXTAREA') return;
      var v = t.value, nv = v.replace(/["\u201C\u201D]/g, "'").replace(/\\/g, '/');
      if (nv === v) return;
      var pos = t.selectionStart;
      setter.call(t, nv);
      t.dispatchEvent(new Event('input', { bubbles: true }));
      try { t.setSelectionRange(pos, pos); } catch (_) {}
    }, true);
    return true;
  }
  var tries = 0, timer = setInterval(function () { if (attach() || ++tries > 60) clearInterval(timer); }, 500);
})();
</script>
</body>
</html>
